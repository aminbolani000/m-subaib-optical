<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: radial-gradient(circle at top, #1f2937 0%, #0b0f14 45%, #05070a 100%);
        color: #fff;
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    .box {
        width: 100%;
        max-width: 720px;
        padding: 55px 45px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.09),
            rgba(255, 255, 255, 0.03)
        );
        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
    }

    .icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 25px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        box-shadow: 0 10px 35px rgba(34, 197, 94, 0.30);
        font-size: 38px;
    }

    h1 {
        margin: 0 0 18px;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -1px;
        color: #ffffff;
    }

    h1 span {
        color: #4ade80;
    }

    p {
        margin: 0 auto;
        max-width: 600px;
        color: #cbd5e1;
        font-size: 17px;
        line-height: 1.8;
    }

    strong {
        color: #ffffff;
        font-weight: 700;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 30px;
        padding: 10px 18px;
        border-radius: 50px;
        background: rgba(34, 197, 94, 0.10);
        border: 1px solid rgba(34, 197, 94, 0.25);
        color: #86efac;
        font-size: 14px;
        font-weight: 600;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 12px #22c55e;
    }

    @media (max-width: 600px) {
        .box {
            padding: 40px 25px;
            border-radius: 20px;
        }

        p {
            font-size: 15px;
        }
    }
</style>
```
